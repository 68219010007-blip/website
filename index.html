<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - ธิติกานต์ สมแก้ว</title>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ตกแต่งพื้นหลังเรืองแสง */
        .bg-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.25);
            filter: blur(120px);
            border-radius: 50%;
            top: 10%;
            left: 15%;
            z-index: 1;
        }

        .bg-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(236, 72, 153, 0.2);
            filter: blur(120px);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            z-index: 1;
        }

        /* การ์ดหลักแบบ Glassmorphism เต็มหน้าจอ */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            align-items: center;
        }

        /* ฝั่งรูปภาพโปรไฟล์ */
        .profile-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 30px;
        }

        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 24px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background-color: #1e293b;
        }

        /* ตกแต่งขอบไฟเรืองแสงรอบรูป */
        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, #a855f7, #ec4899, #3b82f6);
            z-index: -1;
            filter: blur(8px);
            opacity: 0.8;
        }

        .nickname-badge {
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            margin-bottom: 16px;
        }

        .visitor-box {
            margin-top: 15px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .visitor-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* ฝั่งเนื้อหาข้อมูล */
        .info-side {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            border-color: rgba(236, 72, 153, 0.4);
        }

        .info-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .info-card.hobby-card .info-icon {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
        }

        .info-text label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .info-text span {
            font-size: 1.05rem;
            font-weight: 500;
            color: #f8fafc;
        }

        .hobby-card {
            grid-column: span 2;
            background: linear-gradient(90deg, rgba(236, 72, 153, 0.08), rgba(139, 92, 246, 0.08));
        }

        /* Responsive */
        @media (max-width: 900px) {
            body {
                height: auto;
                min-height: 100vh;
                padding: 40px 0;
            }
            .main-card {
                grid-template-columns: 1fr;
                padding: 30px 20px;
                gap: 30px;
            }
            .profile-side {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-right: 0;
                padding-bottom: 30px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .hobby-card {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- ตกแต่งพื้นหลังแสงฟุ้ง -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- โครงสร้างการ์ดหลัก -->
    <div class="main-card">
        
        <!-- ฝั่งโปรไฟล์ & สถิติ -->
        <div class="profile-side">
            <div class="avatar-container">
                <!-- สามารถเปลี่ยน URL รูปภาพตรง src ได้ครับ -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="รูปโปรไฟล์" class="avatar-img">
            </div>
            
            <div class="nickname-badge">
                <i class="fa-solid fa-sparkles"></i> สมาย (Smile)
            </div>

            <div class="visitor-box">
                <span class="visitor-label"><i class="fa-solid fa-eye"></i> จำนวนผู้เข้าชม</span>
                <img src="https://visitor-badge.laobi.icu/badge?page_id=Thitikarn-Somkaew.fullprofile&left_color=1e1b4b&right_color=ec4899&left_text=Visitors" alt="Visitor Counter">
            </div>
        </div>

        <!-- ฝั่งข้อมูลรายละเอียด -->
        <div class="info-side">
            <div>
                <h1 class="header-title">👤 ข้อมูลส่วนตัว</h1>
                <p style="color: #94a3b8; font-size: 0.95rem;">Personal Profile Dashboard</p>
            </div>

            <div class="info-grid">
                
                <!-- ชื่อ-นามสกุล -->
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-user"></i></div>
                    <div class="info-text">
                        <label>ชื่อ-นามสกุล</label>
                        <span>ธิติกานต์ สมแก้ว</span>
                    </div>
                </div>

                <!-- วันเกิด -->
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-cake-candles"></i></div>
                    <div class="info-text">
                        <label>วัน/เดือน/ปีเกิด</label>
                        <span>13/02/2010</span>
                    </div>
                </div>

                <!-- อายุ -->
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div class="info-text">
                        <label>อายุ</label>
                        <span>16 ปี</span>
                    </div>
                </div>

                <!-- สัญชาติ -->
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-flag"></i></div>
                    <div class="info-text">
                        <label>สัญชาติ</label>
                        <span>Thai</span>
                    </div>
                </div>

                <!-- ศาสนา -->
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-dharmachakra"></i></div>
                    <div class="info-text">
                        <label>ศาสนา</label>
                        <span>พุทธ</span>
                    </div>
                </div>

                <!-- งานอดิเรก -->
                <div class="info-card hobby-card">
                    <div class="info-icon"><i class="fa-solid fa-palette"></i></div>
                    <div class="info-text">
                        <label>งานอดิเรกและความสนใจ</label>
                        <span>วาดภาพ</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
