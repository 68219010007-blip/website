<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - ธิติกานต์ สมแก้ว</title>
    <!-- Google Fonts: Prompt -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            background-color: #f0f9ff; /* สีฟ้าอ่อนมากๆ สบายตา */
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.15) 0px, transparent 50%);
        }

        /* การ์ดหลัก */
        .main-container {
            width: 90%;
            max-width: 950px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.12);
            border: 1px solid #bae6fd;
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr;
        }

        /* ฝั่งรูปโปรไฟล์ (ธีมสีฟ้าสดใส) */
        .profile-section {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #38bdf8;
            text-align: center;
        }

        /* ส่วนอัปโหลดรูปภาพ */
        .avatar-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            background-color: #e0f2fe;
        }

        .upload-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #0284c7;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background-color: #f0f9ff;
            transform: scale(1.08);
            color: #0369a1;
        }

        #file-input {
            display: none;
        }

        .profile-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: #e0f2fe;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .visitor-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .visitor-title {
            font-size: 0.75rem;
            color: #e0f2fe;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ฝั่งข้อมูลส่วนบุคคล */
        .info-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #ffffff;
        }

        .header-box {
            border-bottom: 2px solid #e0f2fe;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header-box h1 {
            font-size: 1.5rem;
            color: #0369a1;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-box h1 i {
            color: #0284c7;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .info-item {
            background: #f0f9ff;
            border: 1px solid #e0f2fe;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
        }

        .info-item:hover {
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.08);
            transform: translateY(-2px);
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #0284c7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.12);
        }

        .info-content label {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }

        .info-content span {
            font-size: 0.95rem;
            color: #0c4a6e;
            font-weight: 600;
        }

        .info-item.full-width {
            grid-column: span 2;
            background: linear-gradient(90deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 800px) {
            body {
                height: auto;
                min-height: 100vh;
                padding: 20px 0;
            }
            .main-container {
                grid-template-columns: 1fr;
                width: 95%;
            }
            .profile-section {
                border-right: none;
                border-bottom: 1px solid #38bdf8;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .info-item.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- ส่วนโปรไฟล์ & อัปโหลดรูป -->
        <div class="profile-section">
            <div class="avatar-wrapper">
                <!-- รูปเริ่มต้น -->
                <img id="profile-img" src="img/001.jpg" alt="รูปโปรไฟล์" class="avatar-img">
                
                <!-- ปุ่มคลิกเพื่อเปลี่ยนรูป -->
                <label for="file-input" class="upload-btn" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <div class="profile-title">ธิติกานต์ สมแก้ว</div>
            <div class="profile-subtitle">สมาย (Smile)</div>

            <!-- สถิติการเข้าชม -->
            <div class="visitor-card">
                <span class="visitor-title"><i class="fa-solid fa-chart-line"></i> สถิติการเข้าชม</span>
                <img src="https://visitor-badge.laobi.icu/badge?page_id=Thitikarn-Somkaew.blue-profile&left_color=0369a1&right_color=38bdf8&left_text=Visitors" alt="จำนวนผู้เข้าชม">
            </div>
        </div>

        <!-- ส่วนแสดงข้อมูลส่วนบุคคล -->
        <div class="info-section">
            <div class="header-box">
                <h1><i class="fa-solid fa-address-card"></i> ข้อมูลส่วนบุคคล (Personal Profile)</h1>
            </div>

            <div class="info-grid">
                <!-- ชื่อ-นามสกุล -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-user"></i></div>
                    <div class="info-content">
                        <label>ชื่อ-นามสกุล</label>
                        <span>ธิติกานต์ สมแก้ว</span>
                    </div>
                </div>

                <!-- ชื่อเล่น -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-signature"></i></div>
                    <div class="info-content">
                        <label>ชื่อเล่น</label>
                        <span>สมาย</span>
                    </div>
                </div>

                <!-- วัน/เดือน/ปีเกิด -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-calendar-days"></i></div>
                    <div class="info-content">
                        <label>วัน/เดือน/ปีเกิด</label>
                        <span>13/02/2010</span>
                    </div>
                </div>

                <!-- อายุ -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-clock"></i></div>
                    <div class="info-content">
                        <label>อายุ</label>
                        <span>16 ปี</span>
                    </div>
                </div>

                <!-- สัญชาติ -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-flag"></i></div>
                    <div class="info-content">
                        <label>สัญชาติ</label>
                        <span>Thai</span>
                    </div>
                </div>

                <!-- ศาสนา -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-dharmachakra"></i></div>
                    <div class="info-content">
                        <label>ศาสนา</label>
                        <span>พุทธ</span>
                    </div>
                </div>

                <!-- งานอดิเรก -->
                <div class="info-item full-width">
                    <div class="info-icon"><i class="fa-solid fa-palette"></i></div>
                    <div class="info-content">
                        <label>งานอดิเรกและความสนใจ</label>
                        <span>วาดภาพ</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- สคริปต์สำหรับเปลี่ยนรูปภาพ -->
    <script>
        const fileInput = document.getElementById('file-input');
        const profileImg = document.getElementById('profile-img');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImg.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
