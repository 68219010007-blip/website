   <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - ธิติกานต์ สมแก้ว</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #2b579a;
        }
        h1 {
            font-size: 22px;
            color: #1b365d;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .visitor-counter {
            text-align: center;
            margin-bottom: 20px;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }
        .info-table th, .info-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }
        .info-table th {
            color: #555;
            width: 40%;
            font-weight: 600;
        }
        .info-table td {
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- สถิติการเข้าชม -->
        <div class="visitor-counter">
            <img src="https://visitor-badge.laobi.icu/badge?page_id=Thitikarn-Somkaew.profile&left_color=1b365d&right_color=2b579a&left_text=Visitors" alt="จำนวนผู้เข้าชม">
        </div>

        <h1>👤 ข้อมูลส่วนตัว (Personal Profile)</h1>

        <table class="info-table">
            <tr>
                <th>ชื่อ-นามสกุล:</th>
                <td>ธิติกานต์ สมแก้ว</td>
            </tr>
            <tr>
                <th>ชื่อเล่น:</th>
                <td>สมาย</td>
            </tr>
            <tr>
                <th>วัน/เดือน/ปีเกิด:</th>
                <td>13/02/2010</td>
            </tr>
            <tr>
                <th>อายุ:</th>
                <td>16 ปี</td>
            </tr>
            <tr>
                <th>สัญชาติ:</th>
                <td>Thai</td>
            </tr>
            <tr>
                <th>ศาสนา:</th>
                <td>พุทธ</td>
            </tr>
            <tr>
                <th>งานอดิเรก:</th>
                <td>วาดภาพ</td>
            </tr>
        </table>
    </div>

</body>
</html>
</body>
</html>
