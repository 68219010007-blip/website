<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - ธิติกานต์ สมแก้ว</title>
    <!-- Google Fonts: Prompt -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            background-color: #0f172a; /* Navy/Dark Slate Blue */
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%);
        }

        /* การ์ดหลัก */
        .main-container {
            width: 90%;
            max-width: 950px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr;
        }

        /* ฝั่งรูปโปรไฟล์ */
        .profile-section {
            background: #1e293b;
            color: #ffffff;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #334155;
            text-align: center;
        }

        /* ส่วนอัปโหลดรูปภาพ */
        .avatar-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #3b82f6;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            background-color: #0f172a;
        }

        .upload-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 42px;
            height: 42px;
            background-color: #2563eb;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #1e293b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background-color: #1d4ed8;
            transform: scale(1.08);
        }

        #file-input {
            display: none;
        }

        .profile-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .profile-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .visitor-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .visitor-title {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ฝั่งข้อมูลส่วนบุคคล */
        .info-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-box {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header-box h1 {
            font-size: 1.5rem;
            color: #0f172a;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-box h1 i {
            color: #2563eb;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .info-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .info-icon {
            width: 38px;
            height: 38px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .info-content label {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }

        .info-content span {
            font-size: 0.95rem;
            color: #0f172a;
            font-weight: 600;
        }

        .info-item.full-width {
            grid-column: span 2;
            background: #f1f5f9;
        }

        /* Responsive สำหรับหน้าจอขนาดเล็ก */
        @media (max-width: 800px) {
            body {
                height: auto;
                min-height: 100vh;
                padding: 20px 0;
            }
            .main-container {
                grid-template-columns: 1fr;
                width: 95%;
            }
            .profile-section {
                border-right: none;
                border-bottom: 1px solid #334155;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .info-item.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- ส่วนโปรไฟล์ & อัปโหลดรูป -->
        <div class="profile-section">
            <div class="avatar-wrapper">
                <!-- รูปเริ่มต้น -->
                <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="รูปโปรไฟล์" class="avatar-img">
                
                <!-- ปุ่มสำหรับคลิกเพื่อเปลี่ยนรูป -->
                <label for="file-input" class="upload-btn" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <div class="profile-title">ธิติกานต์ สมแก้ว</div>
            <div class="profile-subtitle">สมาย (Smile)</div>

            <!-- สถิติการเข้าชม -->
            <div class="visitor-card">
                <span class="visitor-title"><i class="fa-solid fa-chart-line"></i> สถิติการเข้าชม</span>
                <img src="https://visitor-badge.laobi.icu/badge?page_id=Thitikarn-Somkaew.formal-web&left_color=0f172a&right_color=2563eb&left_text=Visitors" alt="จำนวนผู้เข้าชม">
            </div>
        </div>

        <!-- ส่วนแสดงข้อมูลส่วนบุคคล -->
        <div class="info-section">
            <div class="header-box">
                <h1><i class="fa-solid fa-address-card"></i> ข้อมูลส่วนบุคคล (Personal Profile)</h1>
            </div>

            <div class="info-grid">
                <!-- ชื่อ-นามสกุล -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-user"></i></div>
                    <div class="info-content">
                        <label>ชื่อ-นามสกุล</label>
                        <span>ธิติกานต์ สมแก้ว</span>
                    </div>
                </div>

                <!-- ชื่อเล่น -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-signature"></i></div>
                    <div class="info-content">
                        <label>ชื่อเล่น</label>
                        <span>สมาย</span>
                    </div>
                </div>

                <!-- วัน/เดือน/ปีเกิด -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-calendar-days"></i></div>
                    <div class="info-content">
                        <label>วัน/เดือน/ปีเกิด</label>
                        <span>13/02/2010</span>
                    </div>
                </div>

                <!-- อายุ -->
                <div class="info-icon-box info-item">
                    <div class="info-icon"><i class="fa-solid fa-clock"></i></div>
                    <div class="info-content">
                        <label>อายุ</label>
                        <span>16 ปี</span>
                    </div>
                </div>

                <!-- สัญชาติ -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-flag"></i></div>
                    <div class="info-content">
                        <label>สัญชาติ</label>
                        <span>Thai</span>
                    </div>
                </div>

                <!-- ศาสนา -->
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-dharmachakra"></i></div>
                    <div class="info-content">
                        <label>ศาสนา</label>
                        <span>พุทธ</span>
                    </div>
                </div>

                <!-- งานอดิเรก -->
                <div class="info-item full-width">
                    <div class="info-icon"><i class="fa-solid fa-palette"></i></div>
                    <div class="info-content">
                        <label>งานอดิเรกและความสนใจ</label>
                        <span>วาดภาพ</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- สคริปต์สำหรับเปลี่ยนรูปภาพ -->
    <script>
        const fileInput = document.getElementById('file-input');
        const profileImg = document.getElementById('profile-img');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImg.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
